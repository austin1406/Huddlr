<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your Money Huddle</title>
<style>
:root{
  --bg:#f6f3ee; --card:#ffffff; --ink:#1d1b18; --muted:#6c665d; --line:#e6e0d6;
  --good:#2f9e63; --watch:#d99a1c; --concern:#d64a3a; --good-bg:#e5f5ec; --watch-bg:#fbf0d9; --concern-bg:#fbe4e1;
  --accent:#2b5bd7; --bubble:#f1ede6; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --seat:#fbf8f3; --wood:#d9b48a; --wood-hi:#ecd2b0; --wood-ink:#3b2a1a; --have-rim:#3aa76d; --owe-rim:#e0674f;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141311; --card:#1e1c19; --ink:#f2eee8; --muted:#a39d93; --line:#33302b;
  --good-bg:#16301f; --watch-bg:#33280f; --concern-bg:#3a1915; --bubble:#2a2723; --shadow:none; --accent:#7ea2ff;
  --seat:#4a443c; --wood:#5a4330; --wood-hi:#6d523b; --wood-ink:#f6e9d8; --have-rim:#2f8a59; --owe-rim:#b9503d;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px;font-weight:600}
.sub{color:var(--muted);font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* the round table */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.stage{position:relative;width:100%;max-width:640px;margin:8px auto 0;aspect-ratio:1/.95}
@media (max-width:560px){.stage{aspect-ratio:1/1.12}}
.table{position:absolute;left:50%;top:51%;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:conic-gradient(from 180deg,var(--owe-rim) 0 50%,var(--have-rim) 50% 100%);padding:clamp(8px,2.2%,14px);box-shadow:0 18px 40px rgba(60,40,20,.18)}
.table .top-surface{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 38%,var(--wood-hi),var(--wood) 75%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--wood-ink);padding:10%}
.table .lbl{font-size:clamp(10px,2.6vw,13px);opacity:.75;letter-spacing:.04em;text-transform:uppercase}
.table .nwv{font-size:clamp(20px,5.4vw,32px);font-weight:800;line-height:1.1;margin:2px 0 6px}
.table .hv,.table .ov{font-size:clamp(11px,2.9vw,14px);font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.h{background:var(--have-rim)}.dot.o{background:var(--owe-rim)}
.side{position:absolute;top:52%;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;transform:translateY(-50%);writing-mode:vertical-rl}
.side.l{left:0;transform:translateY(-50%) rotate(180deg)}.side.r{right:0}
@media (max-width:560px){.side{display:none}}

.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:clamp(80px,23%,140px);
  background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;transition:opacity .3s,transform .3s}
.seat:hover .av,.seat:focus-visible .av{transform:scale(1.06)}
.av{position:relative;width:clamp(56px,14vw,84px);aspect-ratio:1;border-radius:50%;background:var(--seat);border:4px solid var(--line);overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,.12);transition:transform .2s}
.av svg{position:absolute;left:0;top:10%;width:100%}
.seat.coach .av{border-color:var(--accent)}.seat.good .av{border-color:var(--good)}.seat.watch .av{border-color:var(--watch)}.seat.concern .av{border-color:var(--concern)}
.plate{position:relative;margin-top:-9px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px 9px 4px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);min-width:76%}
.plate .n{font-size:clamp(11.5px,3vw,13.5px);font-weight:600;white-space:nowrap}
.plate .b{font-size:clamp(14px,3.8vw,18px);font-weight:800;line-height:1.15}
.plate .ch{font-size:clamp(10.5px,2.8vw,12px);color:var(--muted);white-space:nowrap}
.seat.dim{opacity:.4}
.seat.hit .av{animation:bob .6s ease 2}
.seat.hit .av:after{content:"💬";position:absolute;right:-2px;top:-2px;font-size:16px}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.seat.hit .av{animation:none}}
.tap{text-align:center;font-size:13px;color:var(--muted);margin-top:4px}

/* coach says + reactions */
.say{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:14px;box-shadow:var(--shadow)}
.say .who{font-size:13px;color:var(--muted)}
.say .msg{font-size:17px;font-weight:500;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:13px;padding:3px 9px;border-radius:99px}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.watch{background:var(--watch-bg);color:var(--watch)}.chip.concern{background:var(--concern-bg);color:var(--concern)}
.say.ok{background:var(--good-bg)}.say.no{background:var(--concern-bg)}
.chat{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.chat li{display:flex;gap:10px;align-items:flex-start}
.chat .mini{width:38px;height:38px;flex:none;border-radius:50%;background:var(--seat);border:2px solid var(--line);overflow:hidden;position:relative}
.chat .mini svg{position:absolute;top:8%;left:0;width:100%}
.chat .bub{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 11px;font-size:14.5px}
.chat .bub b{font-size:13px}
.chat li.same{opacity:.55}
.ba{font-size:13px;color:var(--muted);margin-top:3px}.ba b{color:var(--ink);font-size:13px}
.bub{background:var(--bubble);border-radius:14px;padding:9px 11px;font-size:14.5px}

/* decisions */
.try{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:8px 13px;font:inherit;font-size:14.5px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ask{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.ask label{font-size:15px}
.ask input{font:inherit;font-size:17px;width:120px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.go{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.go:disabled{opacity:.5}
.verdict{margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:500;display:none}
.verdict.ok{background:var(--good-bg)}.verdict.no{background:var(--concern-bg)}
.reset{background:none;border:0;color:var(--accent);font:inherit;font-size:15px;cursor:pointer;padding:0;margin-top:8px;display:inline-block}

/* timeline */
.tl{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.tl svg{width:100%;height:auto;display:block}
.events{list-style:none;margin:10px 0 0;padding:0;font-size:14.5px;columns:2;column-gap:24px}
@media (max-width:560px){.events{columns:1}}
.events li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);break-inside:avoid}
.events .d{color:var(--muted);width:52px;flex:none}.events .a{margin-left:auto}
.plus{color:var(--good)}.minus{color:var(--ink)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:9}
.scrim.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media (min-width:720px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet .head{display:flex;gap:12px;align-items:center}.sheet .fig{width:72px}
.rows{margin:14px 0 0;padding:0;list-style:none}
.rows li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.rows small{display:block;color:var(--muted)}
.rows .v{text-align:right;font-weight:600}
.text{display:block;text-align:center;margin-top:16px;background:var(--accent);color:#fff;text-decoration:none;padding:12px;border-radius:12px;font-weight:600}
.x{float:right;background:none;border:0;font-size:24px;color:var(--muted);cursor:pointer;line-height:1}
.note{font-size:12.5px;color:var(--muted);margin-top:24px;text-align:center}
.err{padding:40px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<main id="app"><div class="err">Loading your huddle…</div></main>

<div class="scrim" id="scrim" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<script>
const API = location.pathname.replace(/\/$/, "") + "/api";
let data = null, picked = "buy", result = null, busy = false;

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const money = (n) => { const a = Math.abs(n); return (n < 0 ? "-" : "") + "$" + a.toLocaleString("en-US", { minimumFractionDigits: a % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const day = (iso) => { const [, m, d] = iso.split("-").map(Number); return `${M[m - 1]} ${d}`; };
const statusWord = { good: "Doing well", watch: "Keep an eye on", concern: "Needs attention" };

/* ---------- the people (original simple illustrations) ---------- */
const LOOK = {
  checking: { skin: "#e8b48e", hair: "#3a2a20", shirt: "#2a9d8f", style: "short",  extra: "badge" },
  savings:  { skin: "#c98d64", hair: "#1f1a17", shirt: "#e07a8b", style: "bun",    extra: "glasses" },
  ira:      { skin: "#f1c9a5", hair: "#c9c4bc", shirt: "#5a9e4b", style: "gray",   extra: "sprout" },
  card:     { skin: "#8d5a3c", hair: "#2b1d16", shirt: "#7b5cc4", style: "swoop",  extra: "earring" },
  car_loan: { skin: "#d9a074", hair: "#5b3b26", shirt: "#e8833a", style: "short",  extra: "cap" },
  coach:    { skin: "#b97a55", hair: "#1c1c1c", shirt: "#26407a", style: "short",  extra: "whistle" },
};
function figure(id, mood) {
  const L = LOOK[id] || LOOK.checking;
  const mouth = mood === "happy" ? `<path d="M41 70 Q50 79 59 70" stroke="#3b2418" stroke-width="2.6" fill="none" stroke-linecap="round"/>`
    : mood === "worried" ? `<path d="M42 74 Q50 67 58 74" stroke="#3b2418" stroke-width="2.6" fill="none" stroke-linecap="round"/>`
    : `<path d="M43 72 L57 72" stroke="#3b2418" stroke-width="2.6" stroke-linecap="round"/>`;
  const brows = mood === "worried" ? `<path d="M36 50 L44 47 M64 50 L56 47" stroke="#3b2418" stroke-width="2.2" stroke-linecap="round"/>`
    : `<path d="M36 48 L44 47 M56 47 L64 48" stroke="#3b2418" stroke-width="2.2" stroke-linecap="round"/>`;
  const hair = {
    short: `<path d="M27 52 Q26 26 50 25 Q74 26 73 52 Q70 38 50 37 Q31 38 27 52Z" fill="${L.hair}"/>`,
    bun:   `<circle cx="50" cy="20" r="9" fill="${L.hair}"/><path d="M27 54 Q25 27 50 26 Q75 27 73 54 Q72 36 50 35 Q29 36 27 54Z" fill="${L.hair}"/>`,
    gray:  `<path d="M26 56 Q24 30 50 27 Q76 30 74 56 Q73 42 66 38 Q50 44 34 38 Q27 42 26 56Z" fill="${L.hair}"/>`,
    swoop: `<path d="M26 54 Q22 22 52 23 Q78 25 74 50 Q66 34 40 40 Q30 44 26 54Z" fill="${L.hair}"/>`,
  }[L.style];
  const extra = {
    badge:   `<rect x="58" y="96" width="10" height="13" rx="2" fill="#fff" stroke="#1d3a37" stroke-width="1.5"/><path d="M63 96 L56 84" stroke="#1d3a37" stroke-width="1.5"/>`,
    glasses: `<circle cx="41" cy="57" r="6.5" fill="none" stroke="#2b2b2b" stroke-width="2"/><circle cx="59" cy="57" r="6.5" fill="none" stroke="#2b2b2b" stroke-width="2"/><path d="M47.5 57 L52.5 57" stroke="#2b2b2b" stroke-width="2"/>`,
    sprout:  `<path d="M38 100 L38 92" stroke="#2f6b2a" stroke-width="2"/><path d="M38 93 Q31 90 32 85 Q38 86 38 93Z M38 92 Q45 88 45 84 Q39 85 38 92Z" fill="#8fd16f"/>`,
    earring: `<circle cx="27" cy="66" r="2.6" fill="#f2c94c"/>`,
    cap:     `<path d="M26 44 Q28 25 50 24 Q72 25 74 44Z" fill="#334"/><path d="M60 42 Q76 41 82 46 L60 46Z" fill="#334"/>`,
    whistle: `<path d="M38 86 Q50 100 62 86" stroke="#d8d8d8" stroke-width="1.6" fill="none"/><rect x="45" y="96" width="11" height="6" rx="3" fill="#cfd3d6"/>`,
  }[L.extra];
  return `<svg viewBox="0 0 100 112" role="img" aria-label="${id} feeling ${mood}">
    <path d="M14 112 Q16 84 50 82 Q84 84 86 112Z" fill="${L.shirt}"/>
    <rect x="44" y="72" width="12" height="13" rx="4" fill="${L.skin}"/>
    <ellipse cx="50" cy="56" rx="23" ry="25" fill="${L.skin}"/>
    <circle cx="27" cy="60" r="4" fill="${L.skin}"/><circle cx="73" cy="60" r="4" fill="${L.skin}"/>
    ${hair}${L.extra === "cap" ? extra : ""}
    <circle cx="41" cy="57" r="2.6" fill="#2a1a12"/><circle cx="59" cy="57" r="2.6" fill="#2a1a12"/>
    ${brows}${mouth}
    ${mood === "happy" ? `<circle cx="35" cy="66" r="3.5" fill="#ff8f8f" opacity=".35"/><circle cx="65" cy="66" r="3.5" fill="#ff8f8f" opacity=".35"/>` : ""}
    ${L.extra !== "cap" ? extra : ""}
  </svg>`;
}

/* ---------- render ---------- */
// Where each person sits: Coach at the head, money you have on the left, money you owe on the right.
// The empty seat at the bottom is yours.
const SEATS = { coach: 270, checking: 218, savings: 180, ira: 142, card: 322, car_loan: 38 };
function seat(p) {
  const r = result?.reactions.find((x) => x.id === p.id);
  const isCoach = p.id === "coach";
  const mood = isCoach ? (result ? (result.safe ? "happy" : "worried") : p.mood) : r ? r.mood : p.mood;
  const deg = SEATS[p.id] ?? 90, rad = (deg * Math.PI) / 180;
  const left = 50 + 37 * Math.cos(rad), top = 51 + 40 * Math.sin(rad);
  const cls = [isCoach ? "coach" : p.status, result && !isCoach ? (r?.changed ? "hit" : "dim") : ""].join(" ");
  const sub = isCoach ? `<div class="ch">your guide</div>`
    : r?.changed && r.after ? `<div class="ch num">→ ${esc(r.after.replace(/^lowest /, "low "))}</div>`
    : `<div class="ch">${p.group === "owe" ? "you owe" : "you have"}</div>`;
  return `<button class="seat ${cls}" data-id="${p.id}" style="left:${left.toFixed(1)}%;top:${top.toFixed(1)}%" aria-label="${esc(p.name)}, ${money(p.balance)}, ${statusWord[p.status]}. Tap for details.">
    <div class="av">${figure(p.id, mood)}</div>
    <div class="plate"><div class="n">${p.emoji} ${esc(p.name)}</div>${isCoach ? "" : `<div class="b num">${money(p.balance)}</div>`}${sub}</div>
  </button>`;
}
const mini = (id, mood) => `<div class="mini">${figure(id, mood)}</div>`;

function timeline(t) {
  const W = Math.round(Math.max(340, Math.min(640, (innerWidth - 56) * 1.1))), H = W < 500 ? 230 : 190, pad = { l: 46, r: 10, t: 30, b: 22 };
  const ds = t.days, n = ds.length;
  const bals = ds.map((d) => d.balance);
  const lo = Math.min(...bals, t.cushion, 0) < 0 ? Math.min(...bals) * 1.1 : Math.max(0, Math.min(...bals, t.cushion) - 120);
  const hi = Math.max(...bals);
  const x = (i) => pad.l + (i / (n - 1)) * (W - pad.l - pad.r);
  const y = (v) => pad.t + (1 - (v - lo) / (hi - lo || 1)) * (H - pad.t - pad.b);
  const idx = Object.fromEntries(ds.map((d, i) => [d.date, i]));
  const path = ds.map((d, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(d.balance).toFixed(1)}`).join(" ");
  const area = `${path} L${x(n - 1)} ${y(Math.max(lo, 0))} L${x(0)} ${y(Math.max(lo, 0))}Z`;
  const em = Object.fromEntries([...data.huddle.people, data.huddle.coach].map((p) => [p.id, p.emoji]));
  const marks = t.marks.filter((m) => idx[m.date] != null).map((m) => {
    const i = idx[m.date], cx = x(i);
    return `<line x1="${cx}" x2="${cx}" y1="${pad.t - 6}" y2="${H - pad.b}" stroke="${m.sign === "+" ? "var(--good)" : "var(--line)"}" stroke-width="${m.sign === "+" ? 1.5 : 1}" ${m.sign === "+" ? "" : 'stroke-dasharray="3 3"'}/>
      <text x="${cx}" y="${pad.t - 10}" text-anchor="middle" font-size="14">${m.sign === "+" ? "💰" : em[m.who] || "•"}</text>`;
  }).join("");
  const ticks = (W < 500 ? [0, 14, 28, 41] : [0, 7, 14, 21, 28, 35, 41]).filter((i) => i < n).map((i, k, a) => `<text x="${x(i)}" y="${H - 5}" font-size="11" fill="var(--muted)" text-anchor="${k === a.length - 1 ? "end" : "middle"}">${day(ds[i].date)}</text>`).join("");
  const yt = [hi, t.cushion, ...(lo < 0 ? [0] : [])].filter((v, i, a) => a.indexOf(v) === i).map((v) => `<text x="${pad.l - 6}" y="${y(v) + 4}" font-size="11" fill="var(--muted)" text-anchor="end">${money(Math.round(v))}</text>`).join("");
  const low = ds.reduce((a, d, i) => (d.balance < a.v ? { v: d.balance, i } : a), { v: Infinity, i: 0 });
  return `<svg viewBox="0 0 ${W} ${H}" aria-label="Checking balance for the next six weeks">
    <path d="${area}" fill="var(--accent)" opacity=".08"/>
    ${marks}
    <line x1="${pad.l}" x2="${W - pad.r}" y1="${y(t.cushion)}" y2="${y(t.cushion)}" stroke="var(--watch)" stroke-dasharray="5 4"/>
    <text x="${pad.l + 4}" y="${y(t.cushion) - 5}" font-size="11" fill="var(--watch)">cushion ${money(t.cushion)}</text>
    ${lo < 0 ? `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--concern)"/>` : ""}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(low.i)}" cy="${y(low.v)}" r="4.5" fill="${low.v < 0 ? "var(--concern)" : "var(--accent)"}"/>
    <text x="${x(low.i) + (low.i > n * 0.55 ? -8 : 8)}" y="${y(low.v) - 8}" font-size="11.5" font-weight="600" text-anchor="${low.i > n * 0.55 ? "end" : "start"}" fill="var(--ink)">lowest ${money(low.v)} · ${day(ds[low.i].date)}</text>
    ${ticks}${yt}
  </svg>`;
}

const OPTS = [
  { k: "buy", label: "🛍️ Buy something", ask: "How much?", def: 300 },
  { k: "save", label: "🐷 Move to Savings", ask: "How much?", def: 200 },
  { k: "pay_card", label: "💳 Pay down the card", ask: "How much?", def: 300 },
  { k: "ira", label: "🌱 Add to IRA", ask: "How much?", def: 100 },
  { k: "lose_income", label: "😬 Lose my paycheck", ask: "For how many months?", def: 1, months: true },
];

function render() {
  const h = data.huddle;
  const o = OPTS.find((x) => x.k === picked);
  const coachText = result ? result.verdict : h.coach.bestMove;
  const c = h.coach.counts;
  const all = [...h.people, h.coach];
  $("#app").innerHTML = `
    <div class="top"><div><h1>${esc(h.firstName ? h.firstName + "'s" : "Your")} money huddle</h1>
      <div class="sub">Everyone at one table · ${esc(day(h.localDate))}</div></div></div>

    <div class="stage">
      <div class="side l">Holding your money</div><div class="side r">What you owe</div>
      <div class="table"><div class="top-surface">
        <div class="lbl">Net worth</div><div class="nwv num">${money(h.netWorth)}</div>
        <div class="hv num"><span class="dot h"></span>have ${money(h.have)}</div>
        <div class="ov num"><span class="dot o"></span>owe ${money(h.owe)}</div>
      </div></div>
      ${all.map(seat).join("")}
    </div>
    <div class="tap">Tap anyone at the table to see their details</div>

    <div class="say ${result ? (result.safe ? "ok" : "no") : ""}">
      <div class="who">${h.coach.emoji} Coach${result ? " · " + esc(result.title) : " says"}</div>
      <div class="msg">${esc(coachText)}</div>
      ${result ? `<ul class="chat">${result.reactions.map((r) => {
          const p = h.people.find((x) => x.id === r.id);
          return p ? `<li class="${r.changed ? "" : "same"}">${mini(p.id, r.mood)}<div class="bub"><b>${p.emoji} ${esc(p.name)}</b><br>${esc(r.text)}${r.before && r.after ? `<div class="ba num">${esc(r.before)} → <b>${esc(r.after)}</b></div>` : ""}</div></li>` : "";
        }).join("")}</ul><button class="reset" id="reset">← Back to today</button>`
        : `<div class="chips">${c.concern ? `<span class="chip concern">${c.concern} needs attention</span>` : ""}${c.watch ? `<span class="chip watch">${c.watch} to keep an eye on</span>` : ""}${c.good ? `<span class="chip good">${c.good} doing well</span>` : ""}</div>`}
    </div>

    <h2>Try a decision</h2>
    <div class="try">
      <div class="opts">${OPTS.map((x) => `<button class="opt" data-k="${x.k}" aria-pressed="${x.k === picked}">${x.label}</button>`).join("")}</div>
      <form class="ask" id="ask"><label for="amt">${o.ask}</label>
        <input id="amt" class="num" inputmode="${o.months ? "numeric" : "decimal"}" value="${o.def}" aria-label="${o.ask}">
        <button class="go" ${busy ? "disabled" : ""}>See how everyone reacts</button></form>
    </div>

    <h2>Next 6 weeks in Checking</h2>
    <div class="tl">${timeline(h.timeline)}
      <ul class="events">${h.timeline.marks.map((m) => {
        const who = all.find((p) => p.id === m.who);
        return `<li><span class="d">${day(m.date)}</span><span>${m.sign === "+" ? "💰" : who?.emoji || ""} ${esc(m.label)}</span><span class="a num ${m.sign === "+" ? "plus" : "minus"}">${m.sign === "+" ? "+" : "−"}${money(m.amount)}</span></li>`;
      }).join("")}</ul>
    </div>
    <p class="note">Nobody at this table can move your money. They only explain and suggest.${data.source !== "live" ? " (sample data)" : ""}</p>`;
}

function openSheet(id) {
  const h = data.huddle;
  const p = id === "coach" ? h.coach : h.people.find((x) => x.id === id);
  if (!p) return;
  const sms = data.agentHandle ? `sms:${encodeURIComponent(data.agentHandle)}&body=${encodeURIComponent("@" + p.name + " ")}` : null;
  $("#sheet").innerHTML = `<button class="x" aria-label="Close" id="close">×</button>
    <div class="head"><div class="fig">${figure(p.id, p.mood)}</div><div><div class="name"><b>${p.emoji} ${esc(p.name)}</b></div><div class="sub">${statusWord[p.status]}</div></div></div>
    <div class="bub" style="margin-top:12px">${esc(p.says)}</div>
    <ul class="rows">${p.detail.map((r) => `<li><span>${esc(r.label)}${r.note ? `<small>${esc(r.note)}</small>` : ""}</span><span class="v num">${esc(r.value)}</span></li>`).join("")}</ul>
    ${p.upcoming.length ? `<h2>Coming up</h2><ul class="rows">${p.upcoming.map((u) => `<li><span>${day(u.date)} · ${esc(u.label)}</span><span class="v num ${u.sign === "+" ? "plus" : ""}">${u.sign === "+" ? "+" : "−"}${money(u.amount)}</span></li>`).join("")}</ul>` : ""}
    ${sms ? `<a class="text" href="${sms}">Text ${esc(p.name)}</a>` : ""}`;
  $("#scrim").classList.add("on");
  $("#close").focus();
}
const closeSheet = () => $("#scrim").classList.remove("on");

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const opt = e.target.closest(".opt");
  if (opt) { picked = opt.dataset.k; render(); $("#amt").select(); return; }
  if (e.target.id === "reset") { result = null; render(); return; }
  if (e.target.id === "close" || e.target.id === "scrim") return closeSheet();
  const p = e.target.closest(".seat");
  if (p) openSheet(p.dataset.id);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "ask") return;
  e.preventDefault();
  const v = Number(String($("#amt").value).replace(/[$,\s]/g, ""));
  if (!(v > 0)) return $("#amt").focus();
  busy = true; render();
  const o = OPTS.find((x) => x.k === picked);
  try {
    const r = await fetch(API + "/decide", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(o.months ? { kind: picked, months: v } : { kind: picked, amount: v }) });
    result = r.ok ? await r.json() : null;
  } catch { result = null; }
  busy = false; render();
  $(".stage").scrollIntoView({ behavior: "smooth", block: "start" });
});

async function load() {
  try {
    const r = await fetch(API);
    if (r.status === 404) { $("#app").innerHTML = `<div class="err"><h2>This link has expired</h2>Text “how am I doing?” to get a new one.</div>`; return; }
    data = await r.json();
    if (!$("#scrim").classList.contains("on") && !result && document.activeElement?.id !== "amt") render();
  } catch { if (!data) $("#app").innerHTML = `<div class="err">Couldn't load right now. Pull to refresh.</div>`; }
}
load();
setInterval(load, 10000); // stays current while money moves (paused during a what-if)
</script>
</body>
</html>
